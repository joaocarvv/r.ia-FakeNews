# docker compose up        → sobe a API Web (localhost:5001) e o JupyterLab (localhost:8888) em um único container
# docker compose run app python -m unittest discover tests/  → roda os testes

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HOST_PORT:-5001}:5000"
      - "8888:8888"
    env_file:
      - .env
    volumes:
      # Código, dados e notebooks montados para edição ao vivo (sem rebuild)
      - ./src:/app/src
      - ./notebooks:/app/notebooks
      - ./tests:/app/tests
      - ./data:/app/data
      - ./run_acceptance_app.py:/app/run_acceptance_app.py
      - ./openapi.yaml:/app/openapi.yaml
      - ./start.sh:/app/start.sh
      # Persiste modelos do HuggingFace entre restarts
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  hf_cache:


